<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menedżerski Panel Zarządzania</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Menedżerski Panel Zarządzania — jasny, różowo-fioletowy motyw: różowawe tło, fioletowo-różowe menu boczne, akcent magenta i gradient fiolet → róż; statusy (zielony, bursztyn, czerwony) w osobnych barwach. Bez ciemnego trybu. */
:root {
  color-scheme: light;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-d: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --bg: #fbf2fd; --surface: #ffffff; --surface-2: #fcf6fe; --surface-3: #f3e7fa;
  --ink: #2c1840; --ink-2: #52396b; --ink-3: #75608c; --line: rgba(130, 60, 170, .17); --line-2: rgba(130, 60, 170, .09);
  --accent: #a3279a; --accent-ink: #ffffff; --accent-soft: #fce6f6; --accent-line: #e6a9dc;
  --g1: #7c3aed; --g2: #dc3585; --accent-grad: linear-gradient(135deg, #7c3aed 0%, #b934b0 55%, #dc3585 100%);
  --ok: #137a4b; --ok-bg: #d5f0e2; --warn: #7a5600; --warn-bg: #fae59c; --bad: #b32a20; --bad-bg: #fbd8d4;
  --nav-bg: linear-gradient(175deg, #6c2fd3 0%, #9a35c6 52%, #c93a92 100%); --nav-ink: #f6ebff; --nav-dim: #e4cdf7; --nav-hover: rgba(255, 255, 255, .14); --nav-on: rgba(255, 255, 255, .26); --nav-line: rgba(255, 255, 255, .24); --nav-accent: #ffe1f4;
  --shadow-pop: 0 12px 34px rgba(110, 40, 150, .26), 0 0 0 1px rgba(130, 60, 170, .14);
  --shadow-card: 0 2px 14px rgba(140, 50, 175, .09);
  --s1: #9a3fe0; --t-todo: #b9a6cf; --t-prog: #8b3fe3; --t-done: #1a9d63; --t-hold: #e0a000;
  --tone-todo-bg: #f1e6f9; --tone-todo-ink: #52396b; --tone-prog-bg: #eadcff; --tone-prog-ink: #5b21b6; --tone-done-bg: #d5f0e2; --tone-done-ink: #137a4b; --tone-hold-bg: #fae59c; --tone-hold-ink: #7a5600;
  --lvl-low: #8fd694; --lvl-mod: #f5d547; --lvl-high: #f59a43; --lvl-crit: #e5484d;
  --lvl-low-ink: #0f3d17; --lvl-mod-ink: #4a3c00; --lvl-high-ink: #4d2300; --lvl-crit-ink: #ffffff;
  --meter-bg: rgba(130, 60, 170, .13);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--accent); }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .pt { padding-top: 10px; } .pt-s { padding-top: 4px; margin-bottom: 14px; } .pad { padding: 8px 4px; } .mt { margin-top: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- szkielet: menu boczne + obszar roboczy ---------- */
.app { height: 100%; display: grid; grid-template-columns: 252px minmax(0, 1fr); background: var(--bg); position: relative; overflow: hidden; }
.sidebar { background: var(--nav-bg); color: var(--nav-ink); display: flex; flex-direction: column; padding: 16px 12px 12px; overflow-y: auto; min-height: 0; z-index: 30; }
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; color: #fff; }
.logo { width: 30px; height: 30px; display: inline-flex; flex: none; } .logo svg { width: 100%; height: 100%; }
.sb-name { font: 700 15px/1.25 var(--font-d); letter-spacing: -.005em; }
.sb-nav { flex: 1; }
.sb-group h2 { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--nav-dim); margin: 16px 10px 6px; }
.sb-i { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--nav-ink); font-weight: 500; font-size: 13.5px; text-align: left; }
.sb-i:hover { background: var(--nav-hover); color: #fff; }
.sb-i.on { background: var(--nav-on); color: #fff; font-weight: 600; } .sb-i.on .ico { color: var(--nav-accent); }
.sb-i span { flex: 1; min-width: 0; }
.nbadge { font-style: normal; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font: 700 11px/20px var(--font); text-align: center; background: var(--nav-on); color: #fff; }
.nbadge.acc { background: #fff; color: #8a2a9e; } .nbadge.bad { background: #ffe14d; color: #5a1f00; }
.sb-foot { border-top: 1px solid var(--nav-line); padding-top: 10px; margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.sb-sync { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 0; border-radius: 8px; background: none; color: var(--nav-dim); font-size: 12px; text-align: left; } .sb-sync:hover { background: var(--nav-hover); color: #fff; }
.sb-sync.sync-synced { color: #c9ffe3; } .sb-sync.sync-offline, .sb-sync.sync-error, .sb-sync.sync-readonly { color: #fff1b3; }
.sb-me { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-top: 4px; border: 0; border-radius: 10px; background: var(--nav-hover); color: #fff; text-align: left; } .sb-me:hover { background: var(--nav-on); }
.sb-me > span:not(.av) { flex: 1; display: flex; flex-direction: column; line-height: 1.2; min-width: 0; } .sb-me small { color: var(--nav-dim); font-size: 11px; }
.scrim { display: none; }
.content { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.page-head { flex: none; display: flex; align-items: center; gap: 10px; margin: 14px max(20px, 2vw) 6px; padding: 14px 20px; border-radius: 18px; background: linear-gradient(100deg, #ece0ff 0%, #fadcf2 100%); box-shadow: 0 2px 14px rgba(140, 50, 175, .10); }
.ph-t h1 { font: 700 22px/1.2 var(--font-d); letter-spacing: -.012em; color: #3a1466; } .ph-t p { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.page-head .menu-btn { display: none; }
.main { position: relative; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; overflow: auto; padding: 4px max(20px, 2vw) 36px; }

/* ---------- awatary ---------- */
.av { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--c, #555); color: #fff; font: 700 12px/1 var(--font); letter-spacing: .02em; flex: none; }
.av.sm { width: 28px; height: 28px; font-size: 11px; } .av.xs { width: 20px; height: 20px; font-size: 9px; }
.av-stack { display: inline-flex; gap: 3px; }


/* ---------- przyciski, pola ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border: 0; border-radius: 8px; background: var(--surface-3); color: var(--ink); font-weight: 600; font-size: 13px; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--line); } .btn.sm { padding: 5px 9px; font-size: 12px; }
.btn.primary { background: var(--accent-grad); color: #fff; } .btn.primary:hover { filter: brightness(1.1); }
.btn.danger { background: #b82e24; color: #fff; } .btn.ok { background: var(--ok-bg); color: var(--ok); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--ph); color: var(--ink); } .icon-btn.sm { width: 24px; height: 24px; } .icon-btn.on { color: #e6a700; } .icon-btn.on .ico { fill: currentColor; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
:where(input[type=text], input[type=search], input[type=url], input[type=date], input[type=time], input[type=number], input:not([type]), select, textarea) { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
:where(textarea) { resize: vertical; width: 100%; }
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-width: 0; } .fld > span { font-size: 12px; font-weight: 600; color: var(--ink-2); } .fld.inline { flex-direction: row; align-items: center; margin: 0; }
.chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 13px; } .chk input { accent-color: var(--accent); margin: 0; } .chk.sm { font-size: 13px; }
.chk.pill { padding: 0; }
.row-pick { padding: 6px 4px; border-radius: 8px; } .row-pick:hover { background: var(--surface-2); } .row-pick span { display: flex; flex-direction: column; line-height: 1.25; } .row-pick small { color: var(--ink-3); font-size: 11px; font-weight: 400; }
.hint { font-size: 12px; color: var(--ink-3); line-height: 1.5; margin: 4px 0 8px; }
.tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; line-height: 18px; }
.tag-ok { background: var(--ok-bg); color: var(--ok); } .tag-bad { background: var(--bad-bg); color: var(--bad); } .tag-warn { background: var(--warn-bg); color: var(--warn); } .tag-acc { background: var(--accent-soft); color: var(--accent); }
.tag .ico { width: 12px; height: 12px; }

/* ---------- dymki ---------- */
.pop { position: fixed; z-index: 70; background: var(--surface); color: var(--ink); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 12px; max-height: min(76vh, 560px); overflow: auto; }
.pop-t { font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: center; padding: 0 0 8px; text-transform: none; }
.pop-nav { display: flex; align-items: center; gap: 4px; margin: -4px 0 6px; font-weight: 700; font-size: 13px; color: var(--ink-2); }
.menu { display: flex; flex-direction: column; margin: 0 -6px; } .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.menu > button, .menu-file { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-weight: 500; color: var(--ink); cursor: pointer; }
.menu > button:hover, .menu-file:hover { background: var(--surface-3); } .menu > .danger { color: var(--bad); }
.bs { display: flex; flex-direction: column; gap: 4px; } .bs-row { display: flex; align-items: center; border-radius: 8px; } .bs-row.cur { background: var(--accent-soft); }
.bs-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px; text-align: left; border-radius: 8px; } .bs-open:hover { background: var(--surface-3); }
.bs-sw { width: 44px; height: 32px; border-radius: 6px; flex: none; } .bs-t { display: flex; flex-direction: column; min-width: 0; } .bs-t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bs-t small { color: var(--ink-3); }
.bg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .bg-sw { height: 64px; border: 2px solid transparent; border-radius: 10px; color: #fff; font-weight: 700; text-align: left; padding: 8px 10px; display: flex; align-items: flex-end; } .bg-sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--surface) inset; }
.sw-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; } .sw { height: 32px; border: 0; border-radius: 6px; color: #14181f; display: inline-flex; align-items: center; justify-content: center; } .sw.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.lb-row, .lb-pick, .ar-row, .mem-row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; } .lb-row .lbl-open { flex: 1; } .ar-row { justify-content: space-between; font-size: 13px; }
.mem-row { padding: 6px 4px; } .mem-row span { display: flex; flex-direction: column; line-height: 1.3; } .mem-row small { color: var(--ink-3); font-size: 12px; }
.share-state { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; background: var(--surface-2); margin-bottom: 6px; } .share-state span { display: flex; flex-direction: column; } .share-state small { color: var(--ink-3); }
.day-pop { display: flex; flex-direction: column; gap: 4px; }

/* ---------- okno modalne ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(5, 12, 28, .6); display: flex; align-items: flex-start; justify-content: center; padding: 28px 12px; overflow: auto; }
.modal { width: min(800px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-pop); margin: auto 0; }
.modal-meeting { width: min(900px, 100%); }
.modal-scroll { padding: 18px 22px 22px; }
.m-head { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 12px; }
.m-title-wrap { display: flex; align-items: flex-start; gap: 10px; min-width: 0; } .m-ico { padding-top: 7px; color: var(--ink-2); }
.m-title { font: 700 20px/1.3 var(--font-d); border: 2px solid transparent; background: transparent; resize: none; padding: 3px 8px; border-radius: 8px; width: 100%; field-sizing: content; min-height: 34px; overflow: hidden; }
.m-title:hover { background: var(--surface-2); } .m-title:focus { background: var(--surface); border-color: var(--accent); outline: 0; }
.m-sub { grid-column: 1 / -1; color: var(--ink-3); font-size: 13px; padding-left: 36px; }
.m-grid { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 20px; }
.m-main section, .m-body > section { margin-bottom: 20px; } .m-main h3, .m-body h3, .sec-h h3 { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-bottom: 8px; } .m-main h3 .ico, .m-body h3 .ico { color: var(--ink-2); width: 18px; height: 18px; }
.m-side { display: flex; flex-direction: column; gap: 6px; align-content: start; } .m-side h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 6px 0 2px; }
.side-btn { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; border-radius: 8px; background: var(--surface-3); font-weight: 600; font-size: 13px; text-align: left; color: var(--ink); } .side-btn:hover { background: var(--line); } .side-btn.danger { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-bottom: 18px; } .chip-group h4 { font-size: 12px; color: var(--ink-3); margin-bottom: 5px; font-weight: 600; }
.mem-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 2px; border-radius: 16px; background: var(--surface-3); font-weight: 500; font-size: 13px; }
.icon-btn.add { background: var(--surface-3); border-radius: 50%; width: 30px; height: 30px; }
.due-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 8px; border-radius: 8px; background: var(--surface-3); } .due-chip.due-overdue { background: var(--bad-bg); } .due-chip.due-soon { background: var(--warn-bg); } .due-chip.due-done { background: var(--ok-bg); }
.due-btn { border: 0; background: none; font-weight: 600; padding: 0; color: inherit; } .due-chip input { accent-color: var(--ok); }
.desc { padding: 8px 12px; border-radius: 10px; cursor: pointer; background: var(--surface-2); } .desc:hover { background: var(--surface-3); }
.rich p { margin: 0 0 6px; } .rich ul { margin: 0 0 6px; padding-left: 20px; } .rich li { margin: 2px 0; }
.desc-empty { width: 100%; text-align: left; padding: 14px 12px; border: 0; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; } .desc-empty:hover { background: var(--surface-3); }
.src-note { display: flex; gap: 8px; align-items: center; padding: 8px 12px; margin-bottom: 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 13px; }
.cl { margin-bottom: 18px; } .cl-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; } .cl-h .ico { color: var(--ink-2); width: 18px; height: 18px; }
.cl-title { flex: 1; font: 700 15px var(--font); border: 2px solid transparent; background: none; padding: 3px 6px; border-radius: 6px; } .cl-title:hover { background: var(--surface-2); } .cl-title:focus { border-color: var(--accent); background: var(--surface); outline: 0; }
.prog { display: flex; align-items: center; gap: 10px; margin: 2px 0 6px; } .pg { width: 34px; font-size: 11px; color: var(--ink-3); }
.bar, .meter { flex: 1; height: 8px; border-radius: 4px; background: var(--meter-bg); overflow: hidden; } .bar i, .meter i { display: block; height: 100%; background: var(--accent-grad); border-radius: 4px; transition: width .25s; } .bar.ok i, .meter.ok i { background: var(--ok); } .meter.bad i { background: var(--bad); }
.cl-items { list-style: none; margin: 0; padding: 0; } .cl-items li { display: flex; align-items: flex-start; gap: 10px; padding: 5px 4px; border-radius: 8px; } .cl-items li:hover { background: var(--surface-2); } .cl-items input { margin: 3px 0 0; accent-color: var(--accent); } .cl-items label { flex: 1; cursor: pointer; overflow-wrap: anywhere; } .cl-items .done label { text-decoration: line-through; color: var(--ink-3); } .cl-items .icon-btn { opacity: 0; } .cl-items li:hover .icon-btn, .cl-items li:focus-within .icon-btn { opacity: 1; }
.cl-add { display: flex; gap: 6px; margin-top: 8px; } .cl-add input { flex: 1; }
.att-list { list-style: none; padding: 0; margin: 0; } .att { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); margin-bottom: 4px; } .att-n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cm-new { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; } .cm-new textarea { margin-bottom: 6px; }
.acts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; } .acts li { display: flex; gap: 10px; align-items: flex-start; } .acts small { color: var(--ink-3); margin-left: 8px; font-size: 12px; } .ev { font-size: 13px; color: var(--ink-2); } .cm-h { display: flex; align-items: baseline; } .cm-b { background: var(--surface-2); padding: 6px 12px; border-radius: 10px; margin-top: 3px; } .cm-b p { margin: 0; }
.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 14px; }
.warn-box { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--ink); margin: 0 0 10px; font-size: 13px; } .warn-box .ico { color: var(--warn); margin-top: 2px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 2px; } .sec-h h3 small { font-weight: 500; color: var(--ink-3); }
.parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pr { display: grid; grid-template-columns: minmax(150px, 220px) 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid transparent; } .pr.sel { border-color: var(--accent-line); background: var(--accent-soft); }
.pr-main { display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; } .pr-main input { accent-color: var(--accent); width: 16px; height: 16px; } .pr-n { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; } .pr-n small { color: var(--ink-3); font-size: 11px; }
.pr-why { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; } .why { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line-2); } .why.neg { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pr-score { font: 700 15px var(--font-d); width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.agr-list { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.agr { display: grid; grid-template-columns: 1fr 110px 140px auto auto; gap: 6px; align-items: center; } .agr-t { min-width: 0; }
.agr-add { display: grid; grid-template-columns: 1fr 110px 140px auto; gap: 6px; }
.m-foot { display: flex; gap: 8px; align-items: center; padding-top: 6px; border-top: 1px solid var(--line-2); margin-top: 8px; }


/* analizy */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; } .tabs button { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border: 0; background: none; border-bottom: 3px solid transparent; font-weight: 600; font-size: 13px; color: var(--ink-2); white-space: nowrap; margin-bottom: -1px; } .tabs button:hover { color: var(--ink); background: var(--surface-2); } .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.lead { color: var(--ink-2); margin-bottom: 12px; max-width: 110ch; } .sub { font-size: 14px; margin: 18px 0 8px; }

.tbl tr.closed td { opacity: .55; } .tbl tr.persp th { background: var(--accent-soft); color: var(--accent); font-size: 12px; }

.risk-top { display: grid; grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 18px; } .risk-notes .lead { margin-bottom: 14px; } .matrix-box h3 { font-size: 13px; margin-bottom: 8px; }
.mx-wrap { display: flex; align-items: stretch; gap: 6px; } .mx-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11px; color: var(--ink-3); font-weight: 600; } .mx-tbl { border-collapse: separate; border-spacing: 3px; flex: 1; } .mx-tbl th { font-size: 12px; color: var(--ink-3); width: 20px; } .mx-tbl th[scope=col] { text-align: center; }
.mx { height: 52px; border-radius: 6px; text-align: center; vertical-align: middle; position: relative; } .mx b { display: block; font-size: 12px; line-height: 1.2; padding: 0 2px; } .mx small { position: absolute; right: 4px; bottom: 1px; font-size: 9px; opacity: .65; }
.mx-x { text-align: center; font-size: 11px; color: var(--ink-3); font-weight: 600; margin: 2px 0 8px; } .legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0; margin: 0 0 6px; font-size: 12px; } .legend li { display: flex; align-items: center; gap: 6px; } .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.imp { display: flex; gap: 2px; margin-top: 4px; } .imp i { width: 14px; height: 5px; border-radius: 2px; background: var(--meter-bg); } .imp-1 i:nth-child(-n+1), .imp-2 i:nth-child(-n+2), .imp-3 i { background: var(--accent); }

.status-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; } .status-big { margin-top: 4px; } .status-big .st { font-size: 15px; padding: 4px 12px; }
.dec { list-style: none; margin: 0 0 8px; padding: 0; } .dec li { display: flex; gap: 4px; }
.plan-prog { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; max-width: 480px; }
.bud-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 760px; } .bud-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 6px 0 10px; max-width: 760px; }

/* ---------- panele i siatka stron ---------- */

.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.page-grid.cols-2 { display: grid; } .page-grid.cols-2 > .wide { grid-column: 1 / -1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; min-width: 0; box-shadow: var(--shadow-card); }
.ph { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 12px; } .ph .ico { color: var(--accent); width: 18px; height: 18px; } .ph small { color: var(--ink-3); font-weight: 500; }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--surface-3); font-size: 12px; font-weight: 700; color: var(--ink-2); }
.right { margin-left: auto; font-size: 12px; }

.lead { color: var(--ink-2); max-width: 110ch; margin-bottom: 12px; } .lead-row .lead { margin: 0; }

/* ---------- przegląd ---------- */

.hero-h { font: 700 24px/1.2 var(--font-d); letter-spacing: -.015em; margin-bottom: 6px; }
.hero-p { color: var(--ink-2); max-width: 78ch; font-size: 14.5px; line-height: 1.55; }
.donut { position: relative; width: 150px; height: 150px; flex: none; } .donut svg { width: 100%; height: 100%; }
.donut-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; } .donut-c b { font: 700 32px/1 var(--font-d); letter-spacing: -.02em; } .donut-c small { color: var(--ink-3); font-size: 11px; margin-top: 4px; text-align: center; max-width: 90px; }
.st { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; } .st-ok { background: var(--ok-bg); color: var(--ok); } .st-risk { background: var(--warn-bg); color: var(--warn); } .st-late { background: var(--bad-bg); color: var(--bad); } .st-none { background: var(--surface-3); color: var(--ink-3); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 12px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 3px; color: var(--ink); }
.tile:hover { border-color: var(--accent-line); background: var(--surface-2); }
.tile-t { font-size: 12px; font-weight: 600; color: var(--ink-2); } .tile-v { font: 700 32px/1.1 var(--font-d); letter-spacing: -.02em; } .tile small { color: var(--ink-3); display: flex; align-items: center; gap: 4px; }
.tile.bad .tile-v, .tile.bad small { color: var(--bad); } .tile.warn .tile-v { color: var(--warn); } .tile.warn small { color: var(--warn); } .tile.ok small { color: var(--ok); } .tile.acc .tile-v { color: var(--accent); } .tile.acc small { color: var(--accent); font-weight: 600; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; list-style: none; margin: 0; padding: 0; }
.stage button { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface-2); text-align: left; color: var(--ink); } .stage button:hover { border-color: var(--accent-line); }
.stage-n { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; background: var(--surface-3); color: var(--ink-2); flex: none; }
.stage.st-done .stage-n { background: var(--t-done); color: #fff; } .stage.st-act .stage-n { background: var(--accent); color: var(--accent-ink); }
.stage-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; } .stage-t small { color: var(--ink-3); font-size: 11px; } .stage-t b { font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stack { display: flex; height: 16px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 4px 0 12px; } .stack i { display: block; min-width: 4px; }
.seg-done { background: var(--t-done); } .seg-progress { background: var(--t-prog); } .seg-todo { background: var(--t-todo); } .seg-hold { background: var(--t-hold); }
.stack-leg { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; } .stack-leg li { display: grid; grid-template-columns: 12px 1fr auto 44px; gap: 8px; align-items: center; font-size: 13px; } .stack-leg i { width: 12px; height: 12px; border-radius: 3px; } .stack-leg small { color: var(--ink-3); text-align: right; }
.hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; } .hbars li { display: grid; grid-template-columns: minmax(80px, 120px) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .hb-who { display: inline-flex; align-items: center; gap: 6px; } .hb-t { height: 12px; background: var(--meter-bg); border-radius: 4px; overflow: hidden; } .hb-t i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; } .hb-v { font-weight: 700; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; min-width: 24px; justify-content: flex-end; }
.bar, .meter { flex: 1; height: 8px; border-radius: 4px; background: var(--meter-bg); overflow: hidden; } .bar i, .meter i { display: block; height: 100%; background: var(--accent-grad); border-radius: 4px; transition: width .25s; } .bar.ok i, .meter.ok i { background: var(--t-done); } .meter.bad i { background: var(--bad); }
.kpi { margin-bottom: 4px; } .kpi-h { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 6px; } .kpi-h b { font: 700 17px var(--font-d); } .kpi small { color: var(--ink-3); display: block; margin-top: 4px; }
.dl { list-style: none; margin: 0; padding: 0; } .dl-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 7px 4px; border: 0; background: none; border-radius: 8px; text-align: left; border-top: 1px solid var(--line-2); } .dl li:first-child .dl-row { border-top: 0; } .dl-row:hover { background: var(--surface-2); }
.dl-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.risk-dist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; } .rd { border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; } .rd b { font: 700 22px var(--font-d); } .rd span { font-size: 11px; font-weight: 600; }
.rl-low { background: var(--lvl-low); color: var(--lvl-low-ink); } .rl-mod { background: var(--lvl-mod); color: var(--lvl-mod-ink); } .rl-high { background: var(--lvl-high); color: var(--lvl-high-ink); } .rl-crit { background: var(--lvl-crit); color: var(--lvl-crit-ink); }
.top-risks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; } .top-risks li { display: flex; gap: 10px; align-items: center; }
.rbadge { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 24px; padding: 0 6px; border-radius: 6px; font: 700 12px var(--font-d); }
.bud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; } .bud small, .bud-sum small { display: block; color: var(--ink-3); font-size: 11px; } .bud b, .bud-sum b { font: 700 18px var(--font-d); } .bad { color: var(--bad); }
.lnk.strong { font-weight: 700; text-decoration: none; color: var(--ink); text-align: left; } .lnk.strong:hover { color: var(--accent); text-decoration: underline; }

.up-d { display: flex; flex-direction: column; align-items: center; width: 38px; padding: 3px 0; border-radius: 8px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); flex: none; } .up-d b { font: 700 16px/1.1 var(--font-d); } .up-d small { font-size: 10px; text-transform: uppercase; color: var(--ink-3); }
.ag-t { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.3; } .ag-t b { overflow: hidden; text-overflow: ellipsis; } .ag-t small { color: var(--ink-3); display: flex; align-items: center; gap: 4px; }
.empty-note { padding: 20px; border: 1px dashed var(--line); border-radius: 12px; color: var(--ink-3); text-align: center; } .empty-note.ok { border-style: solid; border-color: transparent; background: var(--ok-bg); color: var(--ok); }

/* oś czasu planu */
.tl { --tl-label: 270px; font-size: 12px; }
.tl-head, .tl-row { display: grid; grid-template-columns: var(--tl-label) minmax(0, 1fr); align-items: stretch; }
.tl-days { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.tl-d { text-align: center; padding: 2px 0; color: var(--ink-3); display: flex; flex-direction: column; line-height: 1.15; } .tl-d b { font-size: 12px; color: var(--ink-2); } .tl-d small { font-size: 10px; text-transform: uppercase; } .tl-d.wkd { background: var(--surface-2); } .tl-d.today b { color: var(--bad); }
.tl-body { position: relative; }
.tl-row { width: 100%; border: 0; border-top: 1px solid var(--line-2); background: none; text-align: left; padding: 0; min-height: 36px; } .tl-row:hover { background: var(--surface-2); }
.tl-l { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 0; min-width: 0; } .tl-l b { flex: none; width: 58px; color: var(--ink-2); font-size: 11px; } .tl-l span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; color: var(--ink); }
.tl-track { position: relative; background-image: repeating-linear-gradient(90deg, var(--line-2) 0, var(--line-2) 1px, transparent 1px, transparent calc(100% / var(--n))); }
.tl-bar { position: absolute; top: 50%; transform: translateY(-50%); height: 22px; border-radius: 5px; display: flex; align-items: center; padding: 0 7px; color: #fff; font-style: normal; overflow: hidden; min-width: 8px; }
.tl-bar em { font-style: normal; font-weight: 600; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-done.tl-bar, i.st-done { background: var(--t-done); } .st-act.tl-bar, i.st-act { background: var(--t-prog); } .st-late.tl-bar, i.st-late { background: var(--lvl-crit); } .st-next.tl-bar, i.st-next { background: var(--t-todo); }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); z-index: 2; pointer-events: none; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0; margin: 0 0 6px; font-size: 12px; } .legend li { display: flex; align-items: center; gap: 6px; } .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; } .legend.inline { margin: 10px 0 0; }

/* decyzje i sygnały */
.dec-list, .att-list2, .hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.dec-item { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--accent-line); background: var(--accent-soft); } .dec-item.compact { padding: 12px 14px; }
.dec-h { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; margin-bottom: 4px; } .dec-h .tags { display: flex; gap: 6px; align-items: center; flex: none; }
.dec-q { margin: 4px 0 6px; line-height: 1.5; }
.att-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.att-ic { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-3); color: var(--ink-2); }
.sev-high .att-ic { background: var(--bad-bg); color: var(--bad); } .sev-med .att-ic { background: var(--warn-bg); color: var(--warn); }
.att-b { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; } .att-k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; } .att-b b { font-size: 13.5px; } .att-d { color: var(--ink-2); font-size: 12.5px; }
.sev-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; } .sev-h.sev-high { color: var(--bad); } .sev-h.sev-med { color: var(--warn); } .sev-h.sev-low { color: var(--ink-3); } .sev-h small { font-weight: 500; }
.hist li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line-2); } .hist li:first-child { border-top: 0; }
.ph + .hint { margin-top: -6px; }

/* zespół i karta projektu */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.person-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; } .person-h h3 { font-size: 15px; } .person-h .av { width: 40px; height: 40px; font-size: 14px; }
.load { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; white-space: nowrap; } .load-high { background: var(--bad-bg); color: var(--bad); } .load-mid { background: var(--surface-3); color: var(--ink-2); } .load-low { background: var(--tone-prog-bg); color: var(--tone-prog-ink); }
.p-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; } .p-stats b { font: 700 22px var(--font-d); display: block; } .p-stats small { color: var(--ink-3); font-size: 11px; } .p-stats .bad small { color: var(--bad); }
.p-tasks { list-style: none; margin: 12px 0 0; padding: 0; } .p-tasks li { border-top: 1px solid var(--line-2); } .p-tasks button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 7px 2px; border: 0; background: none; text-align: left; } .p-tasks button:hover { background: var(--surface-2); }
.p-tasks .t-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; flex: 1; min-width: 0; } .pt-r { display: inline-flex; gap: 8px; align-items: center; flex: none; } .p-tasks.wide .t-text { white-space: normal; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--t-todo); display: inline-block; } .dot.tone-progress { background: var(--t-prog); } .dot.tone-done { background: var(--t-done); } .dot.tone-hold { background: var(--t-hold); }

/* prosty tekst opisu: akapity, wypunktowania, linki */
function rich(text) {
  if (!text) return '';

  const inline = (t) => esc(t)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const ln of lines) {

'use strict';
/* Menedżerski Panel Zarządzania — stan aplikacji i zapis (lokalny lub wspólny w bazie artefaktu) */

const COLS = ['boards', 'lists', 'cards', 'meetings', 'risks', 'meta'];
const emptyState = () => ({ boards: {}, lists: {}, cards: {}, meetings: {}, risks: {}, meta: {} });
let S = emptyState();

const LS_DATA = 'mpz:dane:v1';
const LS_UI = 'mpz:widok:v1';
const mem = {};
function lsGet(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; } catch (e) { return mem[k] ?? null; } }
function lsSet(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* tryb prywatny */ } }
function lsDel(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { /* */ } }

/* ---------- zapis ---------- */
const P = {
  mode: 'local',          // 'local' | 'shared'
  state: 'local',         // 'local' | 'connecting' | 'synced' | 'saving' | 'offline' | 'readonly' | 'error'
  db: null, saved: {}, timer: null, queue: Promise.resolve(), readOnly: false,
  onRemote: () => {}, onStatus: () => {}, onError: () => {},
};

function setPState(s) { if (P.state !== s) { P.state = s; P.onStatus(s); } }

function markSaved() {
  P.saved = {};
  for (const c of COLS) for (const id in S[c]) P.saved[c + '/' + id] = canon(S[c][id]);
}

function schedule() {
  clearTimeout(P.timer);
  P.timer = setTimeout(flush, 280);
}

function flush() {
  clearTimeout(P.timer);
  const ops = [];
  const seen = new Set();
  for (const c of COLS) {
    for (const id in S[c]) {
      const key = c + '/' + id;
      seen.add(key);
      const js = canon(S[c][id]);
      if (P.saved[key] !== js) ops.push({ t: 'set', c, id, key, js });
    }
  }
  for (const key in P.saved) if (!seen.has(key)) { const [c, id] = key.split('/'); ops.push({ t: 'del', c, id, key }); }
  if (!ops.length) return;

  if (P.mode === 'local') {
    lsSet(LS_DATA, JSON.stringify(S));
    for (const o of ops) { if (o.t === 'set') P.saved[o.key] = o.js; else delete P.saved[o.key]; }
    return;
  }
  /* wspólna baza: zapisuj tylko zmienione dokumenty, po jednym naraz */
  if (P.readOnly) { P.onError({ code: 'readonly' }); return; }
  for (const o of ops) { if (o.t === 'set') P.saved[o.key] = o.js; else delete P.saved[o.key]; }
  setPState('saving');
  P.queue = P.queue.then(async () => {
    for (const o of ops) {
      const ref = P.db.doc(o.c + '/' + o.id);
      if (o.t === 'set') await ref.set(JSON.parse(o.js)); else await ref.delete();
    }
    setPState('synced');
  }).catch((e) => {
    if (e && e.code === 'invalid_argument') { P.readOnly = true; setPState('readonly'); }
    else setPState('offline');
    P.onError(e || {});
    resync();
  });
}

/* ponowne wczytanie z bazy po błędzie zapisu */
async function resync() {
  if (!P.db) return;
  try {
    const remote = await readRemote();
    if (remote) { adoptRemote(remote); P.onRemote(); }
  } catch (e) { /* zostaje stan lokalny */ }
}

function withTimeout(p, ms) {
  return new Promise((res, rej) => { const t = setTimeout(() => rej({ code: 'timeout' }), ms); p.then((v) => { clearTimeout(t); res(v); }, (e) => { clearTimeout(t); rej(e); }); });
}

async function readRemote() {
  const snaps = await withTimeout(Promise.all(COLS.map((c) => P.db.collection(c).get())), 12000);
  const remote = emptyState();
  snaps.forEach((snap, i) => snap.docs.forEach((d) => { remote[COLS[i]][d.id] = JSON.parse(JSON.stringify(d.data())); }));
  return remote;
}

function adoptRemote(remote) {
  S = remote;
  markSaved();
}

function applySnapshot(col, snap) {
  let changed = false;
  for (const ch of snap.docChanges()) {
    const id = ch.doc.id, key = col + '/' + id;
    if (ch.type === 'removed') {
      if (S[col][id] !== undefined && canon(S[col][id]) === P.saved[key]) { delete S[col][id]; delete P.saved[key]; changed = true; }
      continue;
    }
    const data = JSON.parse(JSON.stringify(ch.doc.data()));
    const rjs = canon(data);
    if (P.saved[key] === rjs) continue;                       // echo własnego zapisu lub brak zmiany
    if (S[col][id] !== undefined && canon(S[col][id]) !== P.saved[key]) continue; // lokalna, niezapisana zmiana wygrywa
    S[col][id] = data; P.saved[key] = rjs; changed = true;
  }
  if (changed) P.onRemote();
}

async function initShared(db, canWrite) {
  P.db = db; P.mode = 'shared'; setPState('connecting');
  try {
    const remote = await readRemote();
    if (remote.meta.seeded && remote.meta.seeded.v === SEED_VERSION) {
      adoptRemote(remote);
    } else {
      /* pierwsze uruchomienie albo starsza wersja danych: wspólna baza dostaje aktualne dane demonstracyjne,
         a dokumenty starej wersji są usuwane */
      if (canWrite === false) { P.mode = 'local'; setPState('readonly'); return false; }
      adoptRemote(remote);
      S = makeSeed();
      flush();
    }
    COLS.forEach((c) => db.collection(c).onSnapshot((snap) => applySnapshot(c, snap), () => setPState('offline')));
    if (canWrite === false) { P.readOnly = true; setPState('readonly'); } else setPState('synced');
    return true;
  } catch (e) {
    P.mode = 'local'; P.db = null; setPState('offline');
    return false;
  }
}

const pop = { el: null, anchor: null, rect: null, render: null, opts: {}, confirm: null };
function openPop(anchor, render, opts = {}) {
  closePop();
  pop.anchor = anchor; pop.rect = anchor.getBoundingClientRect(); pop.render = render; pop.opts = opts;
  const el = document.createElement('div');
  el.className = 'pop' + (opts.cls ? ' ' + opts.cls : '');
  el.setAttribute('role', 'dialog');
  $('#pop-root').appendChild(el);
  pop.el = el; document.body.classList.add('has-pop');
  refreshPop();
  const f = el.querySelector('[data-autofocus]'); if (f) f.focus();
}
function closePop() { if (pop.el) pop.el.remove(); pop.el = null; pop.anchor = null; pop.render = null; pop.confirm = null; document.body.classList.remove('has-pop'); }
function refreshPop() {
  if (!pop.el) return;
  const st = pop.el.scrollTop;
  const hadFocus = document.activeElement && pop.el.contains(document.activeElement) ? document.activeElement.id : null;
  pop.el.innerHTML = pop.render();
  pop.el.scrollTop = st;
  if (hadFocus) { const f = document.getElementById(hadFocus); if (f && f.focus) f.focus(); }
  placePop();
}
function placePop() {
  const el = pop.el; if (!el) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.min(pop.opts.w || 300, vw - 16);
  el.style.width = w + 'px';
  const r = pop.anchor && pop.anchor.isConnected ? pop.anchor.getBoundingClientRect() : pop.rect;
  pop.rect = r;
  let left = pop.opts.alignRight ? r.right - w : r.left;
  left = clamp(left, 8, vw - w - 8);
  const h = el.offsetHeight;
  let top = r.bottom + 6;
  if (top + h > vh - 8) top = Math.max(8, r.top - h - 6 > 8 ? r.top - h - 6 : vh - h - 8);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
document.addEventListener('pointerdown', (e) => {

  if (pop.el.contains(e.target)) return;

}, true);

/* Czytnik pierwszej kolumny pliku .xlsx bez bibliotek: xlsx to archiwum ZIP z plikami XML */
async function inflateRaw(bytes) {
  const ds = new DecompressionStream('deflate-raw');
  const out = new Response(new Blob([bytes]).stream().pipeThrough(ds));
  return new Uint8Array(await out.arrayBuffer());
}
async function readZipEntries(buf, want) {
  const dv = new DataView(buf); const u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('zip');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const td = new TextDecoder(); const out = {};
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    if (want(name)) {
      const lnl = dv.getUint16(off + 26, true), lel = dv.getUint16(off + 28, true);
      const data = u8.subarray(off + 30 + lnl + lel, off + 30 + lnl + lel + csize);
      const raw = method === 0 ? data : await inflateRaw(data);
      out[name] = td.decode(raw);
    }
    p += 46 + nl + el + cl;
  }
  return out;
}
async function readXlsxFirstColumn(buf) {
  const files = await readZipEntries(buf, (n) => n === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  const sheetName = Object.keys(files).filter((n) => n.startsWith('xl/worksheets/')).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))[0];
  if (!sheetName) throw new Error('sheet');
  const dp = new DOMParser();
  const shared = files['xl/sharedStrings.xml']
    ? Array.from(dp.parseFromString(files['xl/sharedStrings.xml'], 'application/xml').getElementsByTagName('si')).map((si) => Array.from(si.getElementsByTagName('t')).map((t) => t.textContent).join(''))
    : [];
  const doc = dp.parseFromString(files[sheetName], 'application/xml');
  const rows = [];
  Array.from(doc.getElementsByTagName('row')).forEach((row) => {
    const cells = Array.from(row.getElementsByTagName('c')).map((c) => {
      const ref = c.getAttribute('r') || ''; const col = ref.replace(/\d+/g, '');
      let v = '';
      if (c.getAttribute('t') === 's') { const vn = c.getElementsByTagName('v')[0]; v = vn ? shared[Number(vn.textContent)] || '' : ''; }
      else if (c.getAttribute('t') === 'inlineStr') v = Array.from(c.getElementsByTagName('t')).map((t) => t.textContent).join('');
      else { const vn = c.getElementsByTagName('v')[0]; v = vn ? vn.textContent : ''; }
      return { col: col.length * 100 + col.charCodeAt(0), v };
    }).filter((c) => cleanName(c.v)).sort((a, b) => a.col - b.col);
    if (cells.length) rows.push(cells[0].v);
  });
  return rows;
}

function classify(rawNames) {
  const existing = new Set(taskCards().map(taskBaseName));
  const seen = new Set();
  const rows = [];
  rawNames.forEach((raw) => {
    const name = cleanName(raw); if (!name) return;
    const key = norm(name);
    let status = 'new';
    if (seen.has(key)) status = 'dup';
    else if (existing.has(key)) status = 'exists';
    seen.add(key);
    rows.push({ raw: String(raw), name, status, sel: status === 'new', trimmed: String(raw) !== name });
  });
  return rows;
}

function parseCsv(text) {
  return text.split(/\r?\n/).map((l) => l.split(/[;\t,]/)[0]).filter((x) => cleanName(x));
}

C['imp-file'] = async (el) => {
  const file = el.files && el.files[0]; if (!file) return;
  imp.file = file.name; imp.error = ''; imp.rows = []; imp.total = 0;
  try {
    let names = [];
    if (/\.(csv|txt)$/i.test(file.name)) names = parseCsv(await file.text());
    else if (/\.xlsx$/i.test(file.name)) names = await readXlsxFirstColumn(await file.arrayBuffer());
    else {
      const X = await loadXlsxLib();
      const wb = X.read(await file.arrayBuffer(), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      names = X.utils.sheet_to_json(ws, { header: 1, defval: '' }).map((r) => (Array.isArray(r) ? r.find((v) => cleanName(v)) : r)).filter((v) => cleanName(v));
    }
    if (names.length && /^(nazwa|klient|sie[cć]|zlecenie|lp)\b/i.test(cleanName(names[0]))) names.shift();
    imp.total = names.length; imp.rows = classify(names);
    if (!imp.rows.length) imp.error = 'W pliku nie znaleziono żadnych nazw w pierwszej kolumnie.';
  } catch (e) {
    imp.error = /lib/.test(e.message) ? 'Nie udało się wczytać biblioteki do odczytu Excela (potrzebne połączenie z internetem). Zapisz plik jako CSV i spróbuj ponownie.' : 'Nie udało się odczytać pliku. Sprawdź, czy to poprawny plik .xlsx lub .csv (starszy format .xls wymaga połączenia z internetem).';
  }
  renderModal();
};

/* Menedżerski Panel Zarządzania — Harmonogram: kalendarz, spotkania, rezerwacja sal, rekomendacja uczestników, ustalenia → zadania */

const ROOMS = ['Sala A', 'Sala B', 'Online', 'Inne miejsce'];
const BOOKABLE = ['Sala A', 'Sala B'];
const plShow = { meet: true, cards: true };
const isNarrow = () => window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
const plMode = () => (ui.plannerMode === 'month' && isNarrow() && !ui.plModeTouched ? 'agenda' : ui.plannerMode);

const monthKey = (s) => s.slice(0, 7);
function shiftMonth(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function monthGrid(ym) {
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1); const start = new Date(y, m - 1, 1 - ((first.getDay() + 6) % 7));
  const days = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(ymd(d)); }
  return days;
}
const overlaps = (a, b) => timeToMin(a.start) < timeToMin(b.end) && timeToMin(b.start) < timeToMin(a.end);

function meetingConflicts(m) {
  const res = { rooms: [], people: {} };
  for (const o of Object.values(S.meetings)) {
    if (o.id === m.id || o.date !== m.date || !overlaps(m, o)) continue;
    if (BOOKABLE.includes(m.room) && o.room === m.room) res.rooms.push(o);
    for (const p of m.participants || []) if ((o.participants || []).includes(p)) (res.people[p] = res.people[p] || []).push(o);
  }
  return res;
}

/* ---------- rekomendacja uczestników (reguły, każda z uzasadnieniem) ---------- */
const STOP = new Set(['spotkanie', 'spotkania', 'przeglad', 'zespolu', 'tygodniowy', 'zajecia', 'uzgodnienie', 'wspolny', 'dzien']);
function recommend(m) {
  const cards = m.boardId && S.boards[m.boardId] ? boardCards(m.boardId) : allActiveCards();
  const open = cards.filter((c) => !isCardClosed(c));
  const board = S.boards[m.boardId];
  const tokens = [...new Set(norm((m.title || '') + ' ' + (m.agenda || '')).split(/[^a-z0-9]+/).filter((w) => w.length >= 5 && !STOP.has(w)))];
  const stems = tokens.map((w) => w.slice(0, 5));
  const earlier = Object.values(S.meetings).filter((o) => o.id !== m.id && o.date <= m.date);
  const conf = meetingConflicts({ ...m, participants: members().map((x) => x.id) });
  const rows = members().map((mem) => {
    let score = 0; const reasons = [];
    const add = (t, w) => { score += w; reasons.push({ t, w }); };
    if (m.organizer === mem.id) add('Organizator spotkania', 5);
    const mine = open.filter((c) => (c.members || []).includes(mem.id));
    const topic = mine.filter((c) => (c.labels || []).some((l) => (m.topicLabels || []).includes(l)));
    if (topic.length) {
      const names = [...new Set(topic.flatMap((c) => (c.labels || []).filter((l) => (m.topicLabels || []).includes(l)).map((l) => (labelOf(board, l) || {}).name)))].filter(Boolean).join(', ');
      add(`odpowiada za ${topic.length} ${plural(topic.length, 'otwartą kartę', 'otwarte karty', 'otwartych kart')} z tematu (${names})`, Math.min(4, topic.length * 2));
    }
    const kw = mine.filter((c) => !topic.includes(c) && stems.some((s) => norm(c.title).includes(s)));
    if (kw.length) add(`karty pasują do tematu: „${kw[0].title}”${kw.length > 1 ? ` i ${kw.length - 1} ${plural(kw.length - 1, 'inna', 'inne', 'innych')}` : ''}`, Math.min(2, kw.length));
    const od = mine.filter((c) => dueState(c) === 'overdue');
    if (od.length) add(`${od.length} ${plural(od.length, 'karta po terminie', 'karty po terminie', 'kart po terminie')}`, 2);
    const bl = mine.filter((c) => isHoldList(S.lists[c.listId]) || /^bloker/i.test(c.title));
    if (bl.length) add(`zablokowane zadanie: „${bl[0].title}”`, 2);
    const ag = earlier.flatMap((o) => (o.items || []).filter((it) => it.owner === mem.id && (!it.cardId || (S.cards[it.cardId] && !isCardClosed(S.cards[it.cardId])))));
    if (ag.length) add(`${ag.length} ${plural(ag.length, 'otwarte ustalenie', 'otwarte ustalenia', 'otwartych ustaleń')} z poprzednich spotkań`, 2);
    const busy = (conf.people[mem.id] || []);
    if (busy.length) add(`ma inne spotkanie: „${busy[0].title}” (${busy[0].start}–${busy[0].end})`, -3);
    return { id: mem.id, score, reasons, busy: busy.length > 0, rec: score >= 2 && !busy.length };
  });
  return rows.sort((a, b) => b.score - a.score);
}

function recentActivity(n) {

    for (const x of c.comments || []) items.push({ ts: x.ts, by: x.by, cardId: c.id, title: c.title, text: x.text, kind: x.kind });
  }
  for (const l of (S.meta.sim && S.meta.sim.log) || []) items.push({ ts: l.ts, by: null, text: l.text, kind: 'sim' });

'use strict';
/* Menedżerski Panel Zarządzania — Przegląd: stan projektu na jednym ekranie, wskaźniki liczone na żywo */

const hasCriterion = (c) => (c.checklists || []).some((cl) => cl.items.length) || /kryteri/i.test(c.desc || '');

function budgetInfo() {
  const b = S.meta.budget || { estimate: 0, expenses: [], tolerance: 10 };
  const actual = sum(b.expenses || [], (e) => Number(e.amount) || 0);
  const pj = project();
  const total = pj.start && pj.end ? Math.max(1, diffDays(pj.end, pj.start) + 1) : 0;
  const elapsed = total ? clamp(diffDays(todayStr(), pj.start) + 1, 0, total) : 0;
  const timePct = total ? Math.round((elapsed / total) * 100) : 0;
  const usedPct = b.estimate ? Math.round((actual / b.estimate) * 100) : 0;
  return { estimate: b.estimate || 0, actual, usedPct, timePct, pace: usedPct - timePct, tolerance: b.tolerance ?? 10, yearly: b.yearly || 0, left: (b.estimate || 0) - actual, n: (b.expenses || []).length };
}
function agreementsInfo() {
  let total = 0, conv = 0;
  for (const m of Object.values(S.meetings)) {
    if (!(m.status === 'done' || m.date <= todayStr())) continue;
    for (const it of m.items || []) { total++; if (it.cardId) conv++; }
  }
  return { total, conv, pct: total ? Math.round((conv / total) * 100) : null };
}
function qualityInfo() {
  const act = taskCards().filter((c) => !isCardClosed(c));
  const ok = act.filter((c) => (c.members || []).length && c.due && hasCriterion(c));
  return { total: act.length, ok: ok.length, pct: act.length ? Math.round((ok.length / act.length) * 100) : null };
}
function autoKpi(key) {
  if (key === 'budget') { const b = budgetInfo(); return b.n ? b.pace : null; }
  if (key === 'visits') { let n = 0; taskCards().forEach((c) => (c.checklists || []).forEach((cl) => { if (/wizyty/i.test(cl.title)) n += cl.items.filter((i) => i.done).length; })); return n; }
  if (key === 'quality') return qualityInfo().pct;
  if (key === 'agreements') return agreementsInfo().pct;
  return null;
}

function taskStats() {
  const tasks = taskCards();
  const by = { done: [], progress: [], todo: [], hold: [] };
  tasks.forEach((c) => { (by[isCardClosed(c) ? 'done' : (cardTone(c) || 'todo')] || by.todo).push(c); });
  const open = tasks.filter((c) => !isCardClosed(c));
  let ct = 0, cd = 0; tasks.forEach((c) => { const p = cardProgress(c); ct += p.total; cd += p.done; });
  const byMember = members().map((m) => {
    const mine = open.filter((c) => (c.members || []).includes(m.id));
    return { m, open: mine.length, overdue: mine.filter((c) => dueState(c) === 'overdue').length, done: tasks.filter((c) => isCardClosed(c) && (c.members || []).includes(m.id)).length };
  });
  return { tasks, by, open, overdue: open.filter((c) => dueState(c) === 'overdue'), ct, cd, byMember, upcoming: sortBy(open.filter((c) => c.due), (c) => c.due + norm(c.title)).slice(0, 6) };
}

const meter = (pct, cls = '') => `<div class="meter ${cls}" role="img" aria-label="${Math.round(pct)}%"><i style="width:${clamp(pct, 0, 100)}%"></i></div>`;
function hbars(rows, max) {
  return `<ul class="hbars">${rows.map((r) => `<li title="${esc(r.title || r.label)}: ${r.value}"><span class="hb-l">${r.left || esc(r.label)}</span><span class="hb-t"><i style="width:${max ? Math.max(r.value ? 3 : 0, (r.value / max) * 100) : 0}%"></i></span><span class="hb-v">${r.value}${r.extra || ''}</span></li>`).join('')}</ul>`;
}
function donut(pct, label, sub) {
  const r = 52, c = 2 * Math.PI * r; const d = (clamp(pct, 0, 100) / 100) * c;
  return `<div class="donut" role="img" aria-label="${label}: ${pct}%"><svg viewBox="0 0 128 128"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></linearGradient></defs><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--meter-bg)" stroke-width="12"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="url(#dg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 64 64)"/></svg><div class="donut-c"><b>${pct}%</b><small>${sub}</small></div></div>`;
}

/* oś czasu planu 14–28.11 */
function timelineHTML() {
  const p = S.meta.plan; const pj = project();
  if (!p || !p.rows.length) return '<div class="empty-note">Brak kroków planu.</div>';
  const rows = p.rows.filter((r) => r.start && r.due);
  const min = pj.start && pj.start < rows.reduce((a, r) => (r.start < a ? r.start : a), '9999') ? pj.start : rows.reduce((a, r) => (r.start < a ? r.start : a), '9999');
  const max = pj.end && pj.end > rows.reduce((a, r) => (r.due > a ? r.due : a), '0000') ? pj.end : rows.reduce((a, r) => (r.due > a ? r.due : a), '0000');
  const n = diffDays(max, min) + 1; const today = todayStr();
  const days = Array.from({ length: n }, (_, i) => addDays(min, i));
  const pos = (d) => (diffDays(d, min) / n) * 100;
  const todayPos = today >= min && today <= max ? ((diffDays(today, min) + 0.5) / n) * 100 : null;
  const wide = n > 21;
  const head = days.map((d) => `<span class="tl-d ${dowIdx(d) >= 5 ? 'wkd' : ''} ${d === today ? 'today' : ''}">${!wide || dowIdx(d) === 0 || d === today ? `<b>${parseYmd(d).getDate()}</b><small>${wide ? MON_SHORT[parseYmd(d).getMonth()] : DOW[dowIdx(d)]}</small>` : ''}</span>`).join('');
  const body = rows.map((r) => {
    const late = !r.done && r.due < today; const act = !r.done && r.start <= today && today <= r.due;
    const st = r.done ? 'done' : late ? 'late' : act ? 'act' : 'next';
    const stTxt = { done: 'zakończony', late: 'po terminie', act: 'w toku', next: 'zaplanowany' }[st];
    return `<button class="tl-row" data-act="goto-view" data-v="plan" title="${esc(r.action)} · ${esc(r.owner)} · ${stTxt}">
      <span class="tl-l"><b>${esc(r.when)}</b><span>${esc(r.action)}</span></span>
      <span class="tl-track"><i class="tl-bar st-${st}" style="left:${pos(r.start)}%;width:${((diffDays(r.due, r.start) + 1) / n) * 100}%"><em>${esc(r.owner)}</em></i></span></button>`;
  }).join('');
  return `<div class="tl" style="--n:${n}"><div class="tl-head"><span class="tl-l"></span><span class="tl-days">${head}</span></div><div class="tl-body">${body}${todayPos !== null ? `<i class="tl-today" style="left:calc(var(--tl-label) + (100% - var(--tl-label)) * ${(todayPos / 100).toFixed(4)})" title="Dziś"></i>` : ''}</div></div>
    <ul class="tl-list">${rows.map((r) => { const late = !r.done && r.due < today; const act = !r.done && r.start <= today && today <= r.due; const st = r.done ? 'done' : late ? 'late' : act ? 'act' : 'next'; return `<li class="tl-i st-${st}"><button data-act="goto-view" data-v="plan"><span class="tl-dot"></span><span class="tl-t"><small>${esc(r.when)} · ${{ done: 'zakończony', late: 'po terminie', act: 'w toku', next: 'zaplanowany' }[st]}</small><b>${esc(r.action)}</b><em>${esc(r.owner)}</em></span></button></li>`; }).join('')}</ul>
    <ul class="legend inline"><li><i class="st-done"></i>zakończony</li><li><i class="st-act"></i>w toku</li><li><i class="st-late"></i>po terminie</li><li><i class="st-next"></i>zaplanowany</li></ul>`;
}

/* Menedżerski Panel Zarządzania — Do decyzji: prośby o decyzję szefa oraz sygnały wymagające uwagi (liczone automatycznie) */

const SEV_NAME = { high: 'Pilne', med: 'Do sprawdzenia', low: 'Porządki' };

/* sygnały ostrzegawcze: reguły jawne i sprawdzalne */
function attentionItems() {
  const items = []; const today = todayStr();
  const tasks = taskCards(); const open = tasks.filter((c) => !isCardClosed(c));
  open.filter((c) => dueState(c) === 'overdue').forEach((c) => {
    const d = -diffDays(c.due, today);
    items.push({ sev: 'high', ico: 'clock', title: c.title, detail: `Po terminie o ${d} ${plural(d, 'dzień', 'dni', 'dni')} (${fmtShort(c.due)}) · ${(c.members || []).length ? ownerNames(c) : 'bez właściciela'}`, kind: 'Zadanie po terminie', btn: ['Otwórz', 'open-card', `data-card="${c.id}"`] });
  });
  tasks.filter((c) => cardTone(c) === 'hold').forEach((c) => {
    const pend = c.decision && c.decision.status === 'pending';
    items.push({ sev: 'high', ico: 'warn', title: c.title, detail: pend ? 'Zablokowane i czeka na Twoją decyzję' : 'Zadanie wstrzymane. Ustal, co je blokuje.', kind: 'Zadanie wstrzymane', btn: ['Otwórz', 'open-card', `data-card="${c.id}"`] });
  });
  open.filter((c) => cardTone(c) === 'todo' && c.due && diffDays(c.due, today) >= 0 && diffDays(c.due, today) <= 2).forEach((c) => {
    const d = diffDays(c.due, today);
    items.push({ sev: 'med', ico: 'clock', title: c.title, detail: `Termin ${d === 0 ? 'dziś' : d === 1 ? 'jutro' : 'za 2 dni'}, a zadanie jest wciąż w statusie „${(S.lists[c.listId] || {}).title}” · ${(c.members || []).length ? ownerNames(c) : 'bez właściciela'}`, kind: 'Zagrożony termin', btn: ['Otwórz', 'open-card', `data-card="${c.id}"`] });
  });
  const noOwner = open.filter((c) => !(c.members || []).length);
  if (noOwner.length) items.push({ sev: 'med', ico: 'user', title: `${noOwner.length} ${plural(noOwner.length, 'aktywne zadanie nie ma', 'aktywne zadania nie mają', 'aktywnych zadań nie ma')} właściciela`, detail: 'Kryterium wiarygodnego statusu wymaga właściciela, terminu i kryterium ukończenia.', kind: 'Higiena zadań', btn: ['Pokaż', 'show-tasks', 'data-f="owner"'] });
  const noDue = open.filter((c) => !c.due);

/* ---------- karta wyników ---------- */
function kpiEval(k) {
  const cur = k.auto ? autoKpi(k.auto) : k.current;
  if (cur === null || cur === undefined || Number.isNaN(cur)) return { cur: null, st: 'none' };
  const ok = k.mode === 'atmost' ? cur <= k.target : cur >= k.target;
  return { cur, st: ok ? 'ok' : 'off' };
}
function anScore() {
  const sc = S.meta.scorecard; let last = '';
  const rows = sc.rows.map((k) => {
    const e = kpiEval(k); const head = k.persp !== last; last = k.persp;
    const pct = e.cur === null ? 0 : k.mode === 'atmost' ? (k.target === 0 ? (e.cur === 0 ? 100 : 0) : clamp(100 - ((e.cur - k.target) / k.target) * 100, 0, 100)) : clamp((e.cur / (k.target || 1)) * 100, 0, 100);
    const tag = e.st === 'ok' ? `<span class="st st-ok">${ico('check')}Cel osiągnięty</span>` : e.st === 'off' ? `<span class="st st-risk">${ico('warn')}Poniżej celu</span>` : `<span class="st st-none">${ico('clock')}Brak pomiaru</span>`;
    return `${head ? `<tr class="persp"><th colspan="7">${k.persp}</th></tr>` : ''}<tr>
      <td>${ta(k.goal, `data-t="kpi" data-rid="${k.id}" data-f="goal"`, 2)}</td>
      <td>${ta(k.name, `data-t="kpi" data-rid="${k.id}" data-f="name"`, 2)}</td>
      <td class="nw"><span class="tgt">${k.mode === 'atmost' ? '≤' : '≥'} ${inpt(k.target, `data-t="kpi" data-rid="${k.id}" data-f="target" data-num="1" size="3" aria-label="Wartość docelowa"`, 'number')} <small>${esc(k.unit)}</small></span></td>
      <td class="nw">${k.auto ? `<b class="cur">${e.cur === null ? '—' : e.cur + ' ' + esc(k.unit)}</b> <small class="muted">auto</small>` : `<span class="tgt">${inpt(k.current, `data-t="kpi" data-rid="${k.id}" data-f="current" data-num="1" placeholder="—" aria-label="Wartość bieżąca"`, 'number')} <small>${esc(k.unit)}</small></span>`}${meter(Math.round(pct), e.st === 'ok' ? 'ok' : '')}</td>
      <td>${tag}</td>
      <td><small>${ta(k.source, `data-t="kpi" data-rid="${k.id}" data-f="source"`, 2)}</small></td>
      <td>${inpt(k.owner, `data-t="kpi" data-rid="${k.id}" data-f="owner"`)}</td></tr>`;
  }).join('');
  return `<p class="lead">${ta(sc.note, 'data-t="meta" data-k="scorecard.note"', 2)}</p>
    <div class="tbl-wrap"><table class="tbl kpi-tbl"><thead><tr><th>Cel</th><th>Wskaźnik</th><th>Cel (wartość)</th><th>Obecnie</th><th>Stan</th><th>Źródło i rytm</th><th>Właściciel</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">Wskaźniki oznaczone „auto” liczą się na żywo z tablicy, spotkań i budżetu. Pozostałe wpisujemy ręcznie po testach.</p>`;
}

  schedule: { hash: 'harmonogram', label: 'Harmonogram', icon: 'calendar', title: 'Harmonogram i spotkania', sub: () => 'Terminy, spotkania, sale i ustalenia zamieniane w zadania', render: () => renderPlannerView() },
  risks: { hash: 'ryzyka', label: 'Ryzyka', icon: 'shield', title: 'Rejestr ryzyk', sub: () => 'Ocena = prawdopodobieństwo × wpływ, skala 1–5', render: () => renderRisksView() },
  budget: { hash: 'budzet', label: 'Budżet', icon: 'coin', title: 'Budżet', sub: () => 'Szacunek wobec wydatków rzeczywistych', render: () => renderBudgetView() },
  scorecard: { hash: 'wyniki', label: 'Karta wyników', icon: 'target', title: 'Karta wyników', sub: () => 'Wskaźniki projektu: cel, wartość bieżąca i stan', render: () => renderScorecardView() },
  report: { hash: 'raport', label: 'Raport statusowy', icon: 'file', title: 'Raport statusowy', sub: () => `Stan na ${fmtLong(todayStr())}`, render: () => renderReportView() },
  strategy: { hash: 'analiza', label: 'PESTEL i SWOT', icon: 'layers', title: 'PESTEL i SWOT', sub: () => 'Otoczenie projektu i analiza sytuacji', render: () => renderStrategyView() },
  plan: { hash: 'plan', label: 'Plan działań', icon: 'flag', title: 'Plan działań', sub: () => 'Re-baseline 14–28 listopada 2026', render: () => renderPlanView() },
  project: { hash: 'projekt', label: 'Karta projektu', icon: 'briefcase', title: 'Karta projektu', sub: () => 'Cel, zakres MVP, zespół i założenia', render: () => renderProjectView() },
};
const viewHash = () => VIEWS[ui.view].hash;
const setHash = (h) => { try { if (location.hash !== '#' + h) history.replaceState(null, '', '#' + h); } catch (e) { /* */ } };
function setView(v) {
  if (!VIEWS[v]) return;
  ui.view = v; ui.navOpen = false; saveUi(); closePop(); setHash(VIEWS[v].hash); requestRender();
  const m = $('#main'); if (m && m.firstElementChild) m.firstElementChild.scrollTop = 0;
}
function applyHash() {
  const h = (location.hash || '').replace('#', '');
  const v = Object.keys(VIEWS).find((k) => VIEWS[k].hash === h);
  if (v) ui.view = v;
}
window.addEventListener('hashchange', () => { applyHash(); requestRender(); });
A.nav = (el) => setView(el.dataset.v);
A['nav-toggle'] = () => { ui.navOpen = !ui.navOpen; requestRender({ only: 'chrome' }); };
A['nav-close'] = () => { ui.navOpen = false; requestRender({ only: 'chrome' }); };

/* ---------- renderowanie ---------- */
let pendingR = null, rafR = 0;
function requestRender(opts = {}) {
  const only = (opts && opts.only) || 'all';
  if (only === 'none') return;
  pendingR = pendingR || { all: false, main: false, chrome: false };
  pendingR[only] = true;
  if (rafR) return;
  rafR = requestAnimationFrame(() => { rafR = 0; const r = pendingR; pendingR = null; if (r) doRender(r); });
}
function doRender(r) {
  if (r.all || r.chrome) renderChrome();
  if (r.all || r.main) renderMain();
  if (r.all) { renderModal(); refreshPop(); }
}

/* podpisy komórek tabel (na telefonie wiersze stają się kartami z etykietami pól) */
function labelCells(root) {
  $$('table.tbl', root).forEach((t) => {
    const hs = $$('thead th', t).map((th) => th.textContent.trim());
    $$('tbody tr', t).forEach((tr) => {
      Array.from(tr.children).forEach((td, i) => { if (td.tagName === 'TD' && td.colSpan <= 1 && hs[i]) td.setAttribute('data-l', hs[i]); });
    });
  });
}

function renderMain() {
  const root = $('#main');
  const keep = {};
  $$('[data-keep]', root).forEach((el) => { keep[el.dataset.keep] = [el.scrollLeft, el.scrollTop]; });
  let html = '';
  try { html = VIEWS[ui.view].render(); } catch (e) {
    console.error(e);
    html = `<div class="sheet"><div class="empty-note">Wystąpił błąd podczas rysowania widoku. ${esc(e.message)}</div></div>`;
  }
  root.innerHTML = `<div class="view view-${ui.view}" data-keep="view">${html}</div>`;
  labelCells(root);
  $$('[data-keep]', root).forEach((el) => { const k = keep[el.dataset.keep]; if (k) { el.scrollLeft = k[0]; el.scrollTop = k[1]; } });
  applyFocus();
}

const SYNC = {
  local: ['lock', 'Zapis lokalny', 'Dane są zapisywane tylko w tej przeglądarce.'],
  connecting: ['cloud', 'Łączenie…', 'Łączenie ze wspólną bazą zespołu.'],
  synced: ['cloud', 'Dane wspólne', 'Zmiany widzą wszyscy użytkownicy tego panelu.'],
  saving: ['cloud', 'Zapisywanie…', 'Zapisywanie zmian we wspólnej bazie.'],
  offline: ['warn', 'Brak połączenia', 'Zmiany mogą się nie zapisać. Odśwież stronę po odzyskaniu połączenia.'],
  readonly: ['eye', 'Tylko odczyt', 'Nie masz uprawnień do edycji. Poproś właściciela o rolę Współautora.'],
  error: ['warn', 'Błąd zapisu', 'Nie udało się zapisać zmian.'],
};

function navBadge(k) {
  if (k === 'decisions') { const n = decisionsPending().length; return n ? `<i class="nbadge acc" title="Prośby czekające na decyzję">${n}</i>` : ''; }
  if (k === 'tasks') { const n = taskCards().filter((c) => !isCardClosed(c) && dueState(c) === 'overdue').length; return n ? `<i class="nbadge bad" title="Zadania po terminie">${n}</i>` : ''; }
  return '';
}

function renderChrome() {
  const v = VIEWS[ui.view];
  const sy = SYNC[P.state] || SYNC.local;
  const me = memberById(ui.me) || BOSS;
  $('#app').classList.toggle('nav-open', !!ui.navOpen);
  $('#sidebar').innerHTML = `
    <div class="sb-brand"><span class="logo">${LOGO}</span><span class="sb-name">Menedżerski Panel Zarządzania</span></div>
    <div class="demo-tag" title="Osoby, firmy w roli klientów, liczby i zdarzenia w tym panelu są wymyślone, aby pokazać możliwości systemu.">Dane demonstracyjne</div>
    <nav class="sb-nav" aria-label="Nawigacja główna">${NAV.map((g) => `<div class="sb-group"><h2>${g.group}</h2>${g.items.map((k) => `<button class="sb-i ${ui.view === k ? 'on' : ''}" data-act="nav" data-v="${k}" aria-current="${ui.view === k ? 'page' : 'false'}">${ico(VIEWS[k].icon)}<span>${VIEWS[k].label}</span>${navBadge(k)}</button>`).join('')}</div>`).join('')}</nav>
    <div class="sb-foot">
      <button class="sb-sync sync-${P.state}" data-act="share-open" title="${esc(sy[2])}">${ico(sy[0])}<span>${sy[1]}</span></button>
      <button class="sb-demo" data-act="sim-open" aria-label="Symulacja dni pracy">${ico('calendar')}<span><small>Dzień w panelu</small><b>${esc(fmtDow(todayStr()))} ${esc(fmtShort(todayStr()))}</b></span><i class="sb-go">${ico('arrow')}</i></button>
      <button class="sb-i" data-act="settings-open">${ico('sliders')}<span>Dane i ustawienia</span></button>
      <button class="sb-me" data-act="me-open" aria-label="Pracujesz jako ${esc(me.name)}. Zmień.">${avatar(me.id, 'sm')}<span><b>${esc(me.name)}</b><small>${me.id === 'boss' ? 'widok kierownika' : 'członek zespołu'}</small></span>${ico('chevd')}</button>
    </div>`;
  const TABS = ['overview', 'decisions', 'tasks', 'schedule'];
  const short = { overview: 'Przegląd', decisions: 'Decyzje', tasks: 'Zadania', schedule: 'Terminy' };
  $('#tabbar').innerHTML = TABS.map((k) => `<button class="tab ${ui.view === k ? 'on' : ''}" data-act="nav" data-v="${k}" aria-current="${ui.view === k ? 'page' : 'false'}"><span class="tab-ic">${ico(VIEWS[k].icon)}${navBadge(k)}</span><span>${short[k]}</span></button>`).join('')
    + `<button class="tab ${TABS.includes(ui.view) ? '' : 'on'}" data-act="nav-toggle" aria-label="Więcej widoków"><span class="tab-ic">${ico('menu')}</span><span>${TABS.includes(ui.view) ? 'Więcej' : esc(VIEWS[ui.view].label.split(' ')[0])}</span></button>`;
  $('#fab-root').innerHTML = `<button class="fab" data-act="new-task" aria-label="Zleć zadanie">${ico('plus')}</button>`;
  $('#pagehead').innerHTML = `
    <button class="icon-btn menu-btn" data-act="nav-toggle" aria-label="Menu">${ico('menu')}</button>
    <div class="ph-t"><h1>${esc(v.title)}</h1><p>${esc(v.sub())}</p></div>
    <span class="grow"></span>
    <button class="btn" data-act="meeting-new">${ico('calendar')}<span>Zaplanuj spotkanie</span></button>
    <button class="btn primary" data-act="new-task">${ico('plus')}<span>Zleć zadanie</span></button>`;
}

/* tożsamość i udostępnianie */
A['me-open'] = (el) => {
  if (pop.anchor === el) { closePop(); return; }
  openPop(el, () => `<div class="pop-t">Pracujesz jako</div><p class="hint">Komentarze i historia zmian będą podpisane tym imieniem. Decyzje zatwierdza „Szef”. Wybór zapisuje się tylko w tej przeglądarce.</p>${[BOSS, ...members()].map((m) => `<label class="chk row-pick"><input type="radio" name="me" data-chg="me-set" value="${m.id}" ${ui.me === m.id ? 'checked' : ''}>${avatar(m.id, 'sm')}<span><b>${esc(m.name)}</b><small>${esc(m.role || '')}</small></span></label>`).join('')}`, { w: 310 });
};
C['me-set'] = (el) => { ui.me = el.value; ui.meChosen = true; saveUi(); requestRender(); toast(`Pracujesz jako ${memberById(ui.me).name}`); };
A['share-open'] = (el) => {
  if (pop.anchor === el) { closePop(); return; }
  openPop(el, () => {
    const sy = SYNC[P.state] || SYNC.local;
    return `<div class="pop-t">Zapis i udostępnianie</div>
      <div class="share-state sync-${P.state}">${ico(sy[0])}<span><b>${sy[1]}</b><small>${esc(sy[2])}</small></span></div>
      <p class="hint">${P.mode === 'shared' ? 'Wszyscy użytkownicy z dostępem do panelu pracują na tych samych danych. Zmiany pojawiają się na żywo.' : 'Aby zespół pracował na tych samych danych, uruchom panel w trybie wspólnym (opublikowany w Claude) albo wymieniajcie się plikiem danych.'}</p>
      <div class="menu"><button data-act="copy-link">${ico('link')} Kopiuj link do panelu</button>
      <button data-act="export-data">${ico('download')} Eksportuj dane (JSON)</button>
      <label class="menu-file">${ico('upload')} Importuj dane (JSON)<input type="file" accept=".json,application/json" data-chg="import-file" hidden></label></div>`;
  }, { w: 340 });
};
A['copy-link'] = async () => { const ok = await copyText(location.href.split('#')[0] + '#' + viewHash()); toast(ok ? 'Skopiowano link' : 'Nie udało się skopiować linku'); closePop(); };
A['member-add-open'] = (el) => {
  if (pop.anchor === el) { closePop(); return; }
  openPop(el, () => `<div class="pop-t">Dodaj osobę do zespołu</div><label class="fld"><span>Imię i nazwisko</span><input id="nm-name" placeholder="np. Jan Kowalski" maxlength="60" data-enter="member-add" data-autofocus></label><label class="fld"><span>Zakres odpowiedzialności</span><input id="nm-role" placeholder="np. Testy i dokumentacja" maxlength="80" data-enter="member-add"></label><div class="pt">${btn('member-add', 'Dodaj', 'primary')}</div>`, { w: 300 });
};
function memberAdd() {
  const i = $('#nm-name'); const v = i ? i.value.trim() : ''; if (!v) { if (i) i.focus(); return; }
  const palette = ['#7c3aed', '#be185d', '#15803d', '#a16207', '#0369a1', '#b91c1c'];
  S.meta.members.list.push({ id: uid('m'), name: v, color: palette[members().length % palette.length], role: ($('#nm-role').value || '').trim() || 'Członek zespołu' });
  closePop(); commit(); toast(`Dodano osobę: ${v}`);
}
A['member-add'] = memberAdd; K['member-add'] = memberAdd;

/* ---------- start ---------- */
P.onStatus = () => { requestRender({ only: 'chrome' }); if (pop.el && pop.anchor && pop.anchor.dataset.act === 'share-open') refreshPop(); };
P.onError = (e) => {
  if (e.code === 'readonly') toast('Nie masz uprawnień do edycji. Poproś właściciela o rolę Współautora.', { ms: 6000 });
  else toast('Nie udało się zapisać zmian we wspólnej bazie. Sprawdź połączenie.', { ms: 6000 });
};
P.onRemote = () => {
  if (isTyping()) { setTimeout(P.onRemote, 1200); return; }
  requestRender();
};

async function connectShared() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') return;
  let db = null, user = null, canWrite = null;
  try { user = await cl.use('user'); } catch (e) { /* */ }
  try { db = await cl.use('db'); } catch (e) { /* */ }
  if (!db) return;
  try { if (user) canWrite = await user.can('data.write'); } catch (e) { /* */ }
  const ok = await initShared(db, canWrite);
  if (ok) requestRender();
}

function boot() {
  loadLocal(); loadUi();
  if (!VIEWS[ui.view]) ui.view = 'overview';
  if (!memberById(ui.me)) ui.me = 'boss';
  applyHash();
  setHash(viewHash());
  doRender({ all: true });
  if (!ui.meChosen) { setTimeout(() => { if (!modal.render) toast(isNarrow() ? 'Pracujesz jako Szef. Imię zmienisz w menu „Więcej”.' : 'Pracujesz jako Szef. Zespół wybiera swoje imię w lewym dolnym rogu.', { action: 'Zmień', onAction: () => { const el = $('.sb-me'); if (el) el.click(); }, ms: 6000 }); ui.meChosen = true; saveUi(); }, 1400); }
  connectShared();
  window.addEventListener('beforeunload', () => flush());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
